[project]
name = "configguard"
version = "0.1.0"
description = "ConfigGuard: multi-agent network config compliance auditing with AutoGen"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Nataraj Angappan", email = "natrajexplore@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "autogen-agentchat==0.7.5",
    "autogen-ext[openai]==0.7.5",
    "ciscoconfparse2==0.9.18",
    "fastapi==0.142.2",
    "pydantic==2.12.5",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "regex==2026.9.29",
    "uvicorn==0.54.0",
    "websockets==17.1",
]

[project.scripts]
configguard = "configguard.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"  # live-model tests cost money; run with: pytest -m llm
markers = ["llm: runs the full multi-agent audit against a live model (needs API key)"]
